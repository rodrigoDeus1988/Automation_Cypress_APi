name: Cypress

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite a executar (API externa sujeita a limites)
        type: choice
        options: [smoke, bdd, api]
        default: smoke

permissions:
  contents: read

jobs:
  web:
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Executar suite web
        run: npm run test:${{ inputs.suite || 'smoke' }}
        env:
          CYPRESS_BASE_URL: ${{ vars.CYPRESS_BASE_URL }}
          CYPRESS_loginPath: ${{ vars.CYPRESS_LOGIN_PATH }}
          CYPRESS_loginSuccessPath: ${{ vars.CYPRESS_LOGIN_SUCCESS_PATH }}
          CYPRESS_loginUsername: ${{ secrets.CYPRESS_LOGIN_USERNAME }}
          CYPRESS_loginPassword: ${{ secrets.CYPRESS_LOGIN_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-web
          path: cypress/screenshots
          if-no-files-found: ignore
  api:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'api'
    runs-on: ubuntu-latest
    concurrency:
      group: receitaws-public-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:api
